name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — universal (Intel + Apple Silicon) → un solo .dmg
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            macos-universal: true
          # Windows → .msi (WiX) + .exe (NSIS)
          - platform: windows-latest
            args: ''
          # Linux → .deb + .rpm + .AppImage
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # Node.js (coincide con el que usarás tú: v22)
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Rust: necesita 1.77.2 mínimo → stable lo cumple; cache compila mucho más rápido
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.macos-universal
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # El core del job: compila el binario + genera el bundle y sube los
      # instaladores como assets de un release en DRAFT (no se publica solo).
      # Las notas se extraen de CHANGELOG.md desde la sección "## [versión]".
      - name: Extract release notes
        id: release_notes
        shell: bash
        run: |
          NOTES="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (sec) exit; if (index($0, "[" tag "]") > 0) sec = 1; next }
            sec { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="## LinkRouter ${GITHUB_REF_NAME}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LinkRouter ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
