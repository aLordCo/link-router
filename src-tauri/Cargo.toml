[package]
name = "linkrouter"
version = "0.1.0"
description = "Smart cross-platform router and browser selector (Linux, macOS, Windows)"
authors = ["LinkRouter Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "linkrouter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
regex = "1"
sys-locale = "0.3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
